<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | IoThievesSource</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">IoThievesSource</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Builds.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Builds.data.br",
        frameworkUrl: buildUrl + "/Builds.framework.js.br",
        codeUrl: buildUrl + "/Builds.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "IoThievesSource",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                window.unityInstance = unityInstance;   // <-- make it globally reachable
                window.__unityReady = true;
                if (window.__flushUnityMsgQueue) window.__flushUnityMsgQueue();

                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);
      
    </script>

    <!-- Added on top of Unity default index.html -->
    <!-- Firebase (compat) CDN: app, auth, firestore -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- Added on top of Unity default index.html -->
    <script>
      <!-- Firebase config from the console -->
      const firebaseConfig = {
          apiKey: "AIzaSyCg7RD33QVPXg6JBHjwJwPSxKSAFn-qgeY",
          authDomain: "iothieves.firebaseapp.com",
          databaseURL: "https://iothieves-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "iothieves",
          storageBucket: "iothieves.firebasestorage.app",
          messagingSenderId: "756523503388",
          appId: "1:756523503388:web:f5540fe9e4128d668db4d9",
          measurementId: "G-5SP0YZX38P"
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db   = firebase.firestore();

      <!-- Deprecated after adding the global reference -->
      let unityInstanceRef = null;
      (function waitForUnity() {
        if (window.unityInstance) { unityInstanceRef = window.unityInstance; }
        else { setTimeout(waitForUnity, 100); }
      })();

      <!-- We want to log in users as anonymus then give ownership for data with teir same uid -->
      async function ensureAnon() {
        const user = auth.currentUser || (await auth.signInAnonymously()).user;
        return user.uid;
      }

      <!-- Exposing the functions or something like that -->
      window.FB = {
        targetGO: "FirebaseBridge",

        setTarget(goName) { this.targetGO = goName; },

        async save(jsonStr) {
          try {
            const uid = await ensureAnon();
            const data = JSON.parse(jsonStr);
            // One-save-per-user pattern: /saves/{uid}
            await db.collection("saves").doc(uid).set({
              payload: data,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            // Notify Unity of success
            sendToUnity(this.targetGO, "OnFirebaseSaveOK", "ok");
          } catch (e) {
            console.error("Firebase save failed:", e);
            sendToUnity(this.targetGO, "OnFirebaseSaveError", String(e));
          }
        },

        async load() {
          try {
            const uid = await ensureAnon();
            const snap = await db.collection("saves").doc(uid).get();
            const payload = snap.exists ? JSON.stringify(snap.data().payload || {}) : "{}";
            sendToUnity(this.targetGO, "OnFirebaseDataLoaded", payload);
          } catch (e) {
            console.error("Firebase load failed:", e);
            sendToUnity(this.targetGO, "OnFirebaseLoadError", String(e));
          }
        }
      };
    </script>

    <!-- Added on top of Unity default index.html -->
    <script>
      // Try to send immediately
      function __trySend(go, method, arg) {
        try {
          const inst = window.unityInstance || window.gameInstance;
          if (inst && typeof inst.SendMessage === 'function') { inst.SendMessage(go, method, arg ?? ""); return true; }
          if (typeof window.SendMessage === 'function')       { window.SendMessage(go, method, arg ?? ""); return true; }
        } catch (e) { console.error('[UnityMsg] SendMessage error', e); }
        return false;
      }

      // Public API: safe send (queues if not ready)
      function sendToUnity(go, method, arg) {
        if (__trySend(go, method, arg)) return;
        console.warn('[UnityMsg] Unity instance not ready, queuing:', method);
        (window.__unityMsgQueue = window.__unityMsgQueue || []).push([go, method, arg ?? ""]);
      }

      // Called when the runtime is ready (see step 1)
      window.__flushUnityMsgQueue = function () {
        const q = window.__unityMsgQueue;
        if (!q || !q.length) return;
        const left = [];
        for (const item of q) { if (!__trySend(...item)) left.push(item); }
        window.__unityMsgQueue = left; // if still not ready, keep what�s left
      };

      // Also try periodically, just in case
      setInterval(() => { if (window.__unityReady) window.__flushUnityMsgQueue(); }, 250);
    </script>

  </body>
</html>
